    <script>
      // Fix for Chrome extensions attempting to patch window.fetch when it has only a getter
      (function() {
        try {
          var _origFetch = window.fetch;
          // 1. Define writable own property on window so assignments `window.fetch = ...` succeed
          Object.defineProperty(window, 'fetch', {
            value: _origFetch,
            writable: true,
            configurable: true,
            enumerable: true,
          });
        } catch (e1) {
          try {
            Object.defineProperty(window, 'fetch', {
              get: function() { return _origFetch; },
              set: function(fn) { _origFetch = fn; },
              configurable: true,
              enumerable: true,
            });
          } catch (e2) {}
        }

        try {
          if (typeof Window !== 'undefined' && Window.prototype) {
            var protoDesc = Object.getOwnPropertyDescriptor(Window.prototype, 'fetch');
            if (protoDesc && !protoDesc.set) {
              Object.defineProperty(Window.prototype, 'fetch', {
                get: protoDesc.get || function() { return _origFetch; },
                set: function(fn) { _origFetch = fn; },
                configurable: true,
                enumerable: true,
              });
            }
          }
        } catch (e3) {}

        // Prevent external extension errors from breaking application execution
        window.addEventListener('error', function(event) {
          if (
            (event.filename && (event.filename.indexOf('chrome-extension://') !== -1 || event.filename.indexOf('moz-extension://') !== -1)) ||
            (event.message && event.message.indexOf('Cannot set property fetch of #<Window>') !== -1)
          ) {
            if (event.preventDefault) event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
